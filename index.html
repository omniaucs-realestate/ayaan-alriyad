<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تفاصيل المزاد | اسم الشركة</title>
    <meta name="description" content="تفاصيل المزاد العقاري، العقارات المشاركة، ومواعيد المزايدة.">

    <meta property="og:title" content="تفاصيل المزاد | أعيان الرياض">
    <meta property="og:description" content="27 فرصة عقارية استثنائية في الرياض والمزاحمية.">
    <meta property="og:image" content="assets/images/auctions/estithmar-mecca/main.png">
    <meta property="og:type" content="website">

    <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="infath-fonts/RuaqArabic-Light.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="infath-fonts/RuaqArabic-Medium.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="infath-fonts/RuaqArabic-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="infath-fonts/LamaSans-Regular.otf" as="font" type="font/otf" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=12">
    <link rel="stylesheet" href="css/premium.css?v=12">
    <script>document.documentElement.classList.add('js');</script>
</head>
<body>

    <main id="auction-dynamic-content">
        <section class="auction-hero">
            <div class="container auction-hero-inner">
                <div class="auction-logo auction-logo--light">
                    <img src="assets/logo/auc.svg" alt="شعار المزاد" width="46" height="58">
                </div>
                <h1 class="auction-hero-title">جاري تحميل تفاصيل المزاد...</h1>
            </div>
        </section>
    </main>


    <script src="js/data.js?v=13"></script>
    <script src="js/main.js?v=12"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fallbackId = auctionsData.length ? auctionsData[0].id : null;
            const auctionId = urlParams.get('id') ? parseInt(urlParams.get('id'), 10) : fallbackId;

            const auction = auctionsData.find((a) => a.id === auctionId);
            const properties = auctionPropertiesData.filter((p) => p.auctionId === auctionId);

            if (!auction) {
                document.getElementById('auction-dynamic-content').innerHTML =
                    '<section class="auction-hero"><div class="container auction-hero-inner"><h1 class="auction-hero-title">المزاد غير موجود</h1></div></section>';
                return;
            }

            // Always derive the badge from the dates, never from stale data.
            auction.status = computeAuctionStatus(auction);

            renderAuctionDetails(auction, properties);
        });

        function renderAuctionDetails(auction, properties) {
            const container = document.getElementById('auction-dynamic-content');

            const brochureLink = auction.brochureLink || '#';
            const participateLink = auction.participateLink || '#';

            const contact = typeof contactData !== 'undefined' ? contactData : {};
            const waNumber = String(contact.whatsapp || '+966500000000').replace(/\D/g, '');
            const phoneNumber = String(contact.phone || '+966920000000').replace(/\s/g, '');
            const whatsappLink = `https://wa.me/${waNumber}`;
            const phoneLink = `tel:${phoneNumber}`;

            const statusClass = auction.status === 'منتهي'
                ? 'is-ended'
                : (auction.status === 'جاري' ? '' : 'is-upcoming');
            const liveDot = auction.status === 'جاري' ? '<span class="dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>' : '';

            let propertiesHTML = '';

            if (properties.length > 0) {
                propertiesHTML = properties.map((prop, index) => `
                    <article class="prop-card" data-reveal data-delay="${(index % 3) * 100}">
                        <div class="prop-img">
                            <img src="${prop.image}" alt="${prop.title}" loading="lazy" decoding="async"
                                 onerror="this.onerror=null; this.src='${auction.image}';">
                        </div>
                        <div class="prop-content">
                            <h4>${prop.title}</h4>
                            <div class="prop-tags">
                                <span class="prop-area"><i class="bi bi-aspect-ratio" aria-hidden="true"></i> المساحة: ${prop.area}</span>
                                ${prop.deedNumber ? `<span class="prop-area deed"><i class="bi bi-file-earmark-text" aria-hidden="true"></i> صك رقم: <strong>${prop.deedNumber}</strong></span>` : ''}
                            </div>
                            <p class="prop-desc">${prop.description}</p>
                        </div>
                    </article>
                `).join('');
            } else if (auction.status !== 'منتهي') {
                propertiesHTML = '<p class="no-results">سيتم إضافة تفاصيل العقارات قريباً.</p>';
            } else {
                propertiesHTML = '<p class="no-results">انتهى المزاد، نلقاكم في مزادات أخرى.</p>';
            }

            container.innerHTML = `
                <!-- Auction hero -->
                <section class="auction-hero" style="background-image: url('${auction.image}');">
                    <div class="container auction-hero-inner">
                        <div class="auction-logo auction-logo--light" data-reveal>
                            <img src="assets/logo/auc.svg" alt="شعار المزاد" width="92" height="58">
                        </div>
                        <h1 class="auction-hero-title" data-reveal data-delay="80">مـــزاد</h1>
                        <h1 class="auction-hero-title" data-reveal data-delay="80">${auction.title}</h1>
                        <div class="auction-hero-meta" data-reveal data-delay="160">
                            <span class="hero-badge ${statusClass}">${liveDot}${auction.status}</span>
                            <span><i class="bi bi-geo-alt"></i> ${auction.location}</span>
                            <span><i class="bi bi-buildings"></i> ${auction.propertiesCount}</span>
                        </div>
                        <div class="breadcrumb" data-reveal data-delay="220">
                            <a href="auctions.html">المزادات</a>
                            <span class="sep">/</span>
                            <span>${auction.title}</span>
                        </div>
                    </div>
                </section>

                <!-- Overview + actions -->
                <section class="auction-detail-wrapper">
                    <div class="overview-card" data-reveal>
                        <div class="overview-info">
                            <span class="eyebrow">Auction Overview</span>
                            <h2>معلومات المزاد</h2>
                            <div class="info-list">
                                <div class="info-item">
                                    <strong>نوع المزاد</strong>
                                    <span>${auction.type}</span>
                                </div>
                                <div class="info-item">
                                    <strong>بداية المزاد</strong>
                                    <span>${auction.start}</span>
                                </div>
                                <div class="info-item">
                                    <strong>نهاية المزاد</strong>
                                    <span>${auction.end}</span>
                                </div>
                                <div class="info-item">
                                    <strong>الموقع</strong>
                                    <span>${auction.location}</span>
                                </div>
                                <div class="info-item">
                                    <strong>عدد العقارات</strong>
                                    <span>${auction.propertiesCount}</span>
                                </div>
                            </div>
                            <div class="auction-note">
                                تُدار المزايدة عبر منصة إلكترونية معتمدة، ويتم تحديث بيانات العقارات
                                والمواعيد بشكل مستمر. ننصح بمراجعة كتيب المزاد قبل المشاركة.
                            </div>
                        </div>

                        <div class="overview-actions">
                            ${auction.status !== 'منتهي'
                                ? `<a href="${participateLink}" class="btn btn-auction btn-lg" ${participateLink !== '#' ? 'target="_blank" rel="noopener"' : ''}><i class="bi bi-hammer" aria-hidden="true"></i> المشاركة في المزاد</a>`
                                : `<button class="btn btn-lg btn-ended" disabled><i class="bi bi-lock" aria-hidden="true"></i> المزاد انتهى</button>`}
                            <a href="${brochureLink}" class="btn btn-auction-outline" ${brochureLink !== '#' ? 'target="_blank" rel="noopener"' : ''}><i class="bi bi-file-earmark-pdf" aria-hidden="true"></i> تحميل كتيب المزاد (PDF)</a>
                            <div class="action-buttons">
                                <a href="${whatsappLink}" target="_blank" rel="noopener" class="btn btn-whatsapp"><i class="bi bi-whatsapp" aria-hidden="true"></i> واتساب</a>
                                <a href="${phoneLink}" class="btn btn-call"><i class="bi bi-telephone" aria-hidden="true"></i> اتصال</a>
                            </div>
                        </div>
                    </div>

                    <!-- Properties -->
                    <div class="properties-section">
                        <div class="properties-header" data-reveal>
                            <div>
                                <span class="eyebrow">Properties</span>
                                <h3>عقارات المزاد</h3>
                            </div>
                            <span class="properties-count">${properties.length} Properties</span>
                        </div>
                        <div class="props-grid">
                            ${propertiesHTML}
                        </div>
                    </div>
                </section>
            `;

            window.observeReveals?.();
        }
    </script>
</body>
</html>
